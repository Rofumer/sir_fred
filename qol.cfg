# Sir Fred: Quality of Life Edition - build configuration.
# 1 = enabled, 0 = disabled (original behaviour). Run `make` after editing.
# With every QOL_* switch at 0 the build is byte-identical to the original.

[rope]
# A: tolerant rope / vine grab while airborne
QOL_ROPE     = 1
# extra reach in pixels beyond the original grab edge (0..8, original 0)
ROPE_FWD     = 4
# extra reach in pixels back towards / into Fred (0..8, original 0)
ROPE_BACK    = 4
# character rows tested from the head row down (1..3, original 1)
ROPE_ROWS    = 2

[descend]
# B: DOWN at a ledge climbs onto the vine below with +-DESC_TOL px tolerance
QOL_DESCEND  = 1
# even number 0..6 (original 0)
DESC_TOL     = 4

[items]
# C: pick-up box (original 16 / 16 / 24)
QOL_PICKUP   = 1
PICK_X       = 20
PICK_Y_LOW   = 20
PICK_Y_HIGH  = 24
# D: item USE handlers see Fred's box grown by USE_TOL px per side (1..6)
QOL_USE      = 1
USE_TOL      = 4

[jump]
# E: coyote time - jump still possible this many game ticks after
#    walking off a ledge (1..16; 2-3 game ticks per TV frame, 6 = ~100 ms)
QOL_COYOTE   = 1
COYOTE_TICKS = 6

[inertia]
# F: turn-around skid threshold (original 8; bigger = turns sooner)
QOL_INERTIA  = 0
TURN_SPEED   = 8

[swing]
# G: rope swing simplification (makes the rope swing persistent and stronger)
QOL_SWING            = 1
# 1 = rope never loses energy and keeps swinging (original: energy decays)
SWING_NO_DAMPING     = 1
# initial phase after landing on a rope (original 5; safe range 1..8)
SWING_MAX_PHASE      = 8
# max phase reachable by pressing left/right on the rope (original 7; 1..8)
SWING_PUMP_CAP       = 8
# minimum FRED_SPEED needed to start a swing on landing (original 10; 1..255)
SWING_SPEED_THRESHOLD = 1
